<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>特别鸣谢 · 乆尗</title>
<meta name="description" content="谢谢你把这一关替我过了。">
<meta name="theme-color" content="#0A2C33">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230A2C33'/%3E%3Ctext x='50' y='54' font-size='62' text-anchor='middle' dominant-baseline='central' fill='%2339C5BB'%3E%E4%B9%86%3C/text%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------- */
:root{
  --miku:#39C5BB;
  --miku-lo:#7FE3DC;
  --miku-hi:#C4F5EF;
  --miku-pink:#E12885;
  --miku-pink-lo:#FF8FC7;
  --accent:#39C5BB;
  --glow:rgba(57,197,187,.5);
  --ink:#EAF7F6;
  --ink-2:#8FB4B2;
  --card:rgba(8,34,39,.76);
  --line:rgba(127,227,220,.24);
  --sans:"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --kai:"Kaiti SC","KaiTi","STKaiti","Songti SC","Noto Serif SC",serif;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden;
  font-family:var(--sans);
  color:var(--ink);
  background:#04141A;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img{max-width:100%;display:block}

/* ---------- Miku 背景：渐变 / 网格 / 声波环 / 频谱 / CV01 ---------- */
.bg{
  position:fixed; inset:0; z-index:-6;
  background:
    radial-gradient(78% 62% at 14% 6%, rgba(225,40,133,.26) 0%, transparent 62%),
    radial-gradient(72% 58% at 88% 94%, rgba(57,197,187,.30) 0%, transparent 64%),
    radial-gradient(120% 92% at 50% 6%, #2C848B 0%, #14565E 25%, #0A2C33 56%, #04141A 100%);
}
.grid{
  position:fixed; inset:0; z-index:-5; pointer-events:none;
  background-image:
    linear-gradient(rgba(57,197,187,.11) 1px, transparent 1px),
    linear-gradient(90deg, rgba(57,197,187,.11) 1px, transparent 1px);
  background-size:42px 42px;
  -webkit-mask-image:radial-gradient(125% 85% at 50% 30%, #000 0%, transparent 76%);
  mask-image:radial-gradient(125% 85% at 50% 30%, #000 0%, transparent 76%);
}
.ripple{
  position:fixed; left:50%; top:40%; z-index:-4; pointer-events:none;
  width:min(165vw,1180px); aspect-ratio:1; transform:translate(-50%,-50%);
  background:repeating-radial-gradient(circle at 50% 50%,
    rgba(57,197,187,.13) 0 1px, transparent 1px 62px);
  -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 58%);
  mask-image:radial-gradient(circle, #000 0%, transparent 58%);
  opacity:.85;
}
.eq{
  position:fixed; left:0; right:0; bottom:0; z-index:-4; pointer-events:none;
  height:19vh; display:flex; align-items:flex-end; gap:2px; padding:0 4px;
  opacity:.3;
  -webkit-mask-image:linear-gradient(0deg, #000 0%, transparent 100%);
  mask-image:linear-gradient(0deg, #000 0%, transparent 100%);
}
.eq i{
  flex:1; min-width:2px; border-radius:2px 2px 0 0;
  background:linear-gradient(180deg, var(--miku-hi), var(--miku) 48%, var(--miku-pink));
  transform-origin:bottom;
  animation:eq 2.1s ease-in-out infinite;
}
@keyframes eq{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
.eq i:nth-child(7n+1){animation-delay:-.00s; height:30%}
.eq i:nth-child(7n+2){animation-delay:-.30s; height:56%}
.eq i:nth-child(7n+3){animation-delay:-.60s; height:40%}
.eq i:nth-child(7n+4){animation-delay:-.90s; height:76%}
.eq i:nth-child(7n+5){animation-delay:-1.20s; height:48%}
.eq i:nth-child(7n+6){animation-delay:-1.50s; height:66%}
.eq i:nth-child(7n+7){animation-delay:-1.80s; height:34%}

/* 斜向光带 + 双马尾剪影（Miku 意象） */
.streaks{
  position:fixed; inset:0; z-index:-5; pointer-events:none; opacity:.6;
  background:
    linear-gradient(118deg, transparent 40%, rgba(57,197,187,.20) 50%, transparent 60%),
    linear-gradient(118deg, transparent 64%, rgba(225,40,133,.16) 74%, transparent 84%),
    linear-gradient(118deg, transparent 10%, rgba(196,245,239,.12) 18%, transparent 26%);
  -webkit-mask-image:radial-gradient(130% 95% at 50% 42%, #000 0%, transparent 84%);
  mask-image:radial-gradient(130% 95% at 50% 42%, #000 0%, transparent 84%);
}
.tails{
  position:fixed; inset:0; z-index:-5; pointer-events:none;
  width:100%; height:100%; opacity:.55;
  -webkit-mask-image:radial-gradient(circle at 50% 46%, transparent 24%, #000 86%);
  mask-image:radial-gradient(circle at 50% 46%, transparent 24%, #000 86%);
}

.mark{
  position:fixed; left:clamp(10px, 3vw, 40px); top:clamp(8px, 3vh, 30px);
  z-index:-5; pointer-events:none; line-height:.86;
  font-size:clamp(58px, 15vh, 150px); font-weight:700; letter-spacing:-.05em;
  color:transparent; -webkit-text-stroke:1px rgba(57,197,187,.2);
}

.glowspot{
  position:fixed; left:50%; top:38%; z-index:-3; pointer-events:none;
  width:min(150vw,980px); aspect-ratio:1; transform:translate(-50%,-50%);
  background:radial-gradient(circle, var(--glow) 0%, transparent 60%);
  opacity:.45; filter:blur(12px);
}
#fx{position:fixed; inset:0; z-index:-3; pointer-events:none}

/* ---------- badge ---------- */
.badge{
  position:fixed; top:max(16px, env(safe-area-inset-top)); right:16px; z-index:6;
  display:inline-flex; align-items:center; gap:.5em;
  padding:.4em .9em; border-radius:999px;
  font-size:.74rem; letter-spacing:.08em; color:var(--ink);
  background:var(--card); border:1px solid var(--line);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 22px rgba(57,197,187,.16);
  animation:drop .8s cubic-bezier(.2,.8,.3,1) .5s both;
}
.badge[hidden]{display:none}
.badge .dot{width:.46em;height:.46em;border-radius:50%;background:var(--accent);box-shadow:0 0 9px var(--glow)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

/* ---------- 背景音乐播放器 ---------- */
.player{
  position:fixed; left:16px; bottom:max(16px, env(safe-area-inset-bottom)); z-index:6;
  display:inline-flex; align-items:center; gap:.28em;
  padding:.32em .5em; border-radius:999px;
  font-family:var(--sans); color:var(--ink);
  background:var(--card); border:1px solid var(--line);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  box-shadow:0 0 22px rgba(57,197,187,.18);
  animation:drop .8s cubic-bezier(.2,.8,.3,1) .7s both;
}
.player[hidden]{display:none}
.pl-main{
  display:inline-flex; align-items:center; gap:.6em;
  padding:.32em .62em; border:0; border-radius:999px; background:transparent;
  color:inherit; font:inherit; cursor:pointer; text-align:left;
}
.pl-main:hover{background:rgba(57,197,187,.12)}
.pl-main:focus-visible{outline:2px solid var(--miku-hi); outline-offset:2px}
.pl-note{font-size:1.05rem; line-height:1; color:var(--miku); transition:color .3s ease}
.pl-meta{display:grid; gap:.08em; line-height:1.25; max-width:11.5em}
.pl-title{
  font-size:.76rem; font-weight:700; letter-spacing:.03em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pl-sub{
  font-size:.6rem; letter-spacing:.06em; color:var(--ink-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.pl-bars{display:inline-flex; align-items:flex-end; gap:2px; height:1rem}
.pl-bars i{
  width:2px; height:100%; border-radius:2px; transform-origin:bottom;
  background:linear-gradient(180deg, var(--miku-hi), var(--miku) 60%, var(--miku-pink));
  transform:scaleY(.32);
}
.pl-nav{
  width:1.7rem; height:1.7rem; flex:0 0 auto; padding:0;
  display:grid; place-items:center;
  border:1px solid var(--line); border-radius:50%; background:transparent;
  color:var(--ink-2); font-size:1rem; line-height:1; cursor:pointer;
}
.pl-nav:hover{color:var(--ink); border-color:var(--miku-lo); background:rgba(57,197,187,.12)}
.pl-nav:focus-visible{outline:2px solid var(--miku-hi); outline-offset:2px}
.player.playing .pl-bars i{animation:bar .9s ease-in-out infinite}
.player.playing .pl-bars i:nth-child(2){animation-delay:-.22s}
.player.playing .pl-bars i:nth-child(3){animation-delay:-.45s}
.player.playing .pl-bars i:nth-child(4){animation-delay:-.68s}
.player.playing .pl-note{color:var(--miku-pink-lo); text-shadow:0 0 12px var(--miku)}
@keyframes bar{0%,100%{transform:scaleY(.32)}50%{transform:scaleY(1)}}
@media (max-width:600px){
  .pl-meta{max-width:8.5em}
  .pl-bars{display:none}
}

/* ---------- stage：单屏不滚动 ---------- */
.stage{
  position:relative; z-index:1;
  min-height:100svh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:clamp(6px, 1.3vh, 15px);
  padding:clamp(12px, 2.6vh, 30px) 20px;
  text-align:center;
}
.stage > *{animation:rise .95s cubic-bezier(.2,.8,.3,1) both}
.stage > *:nth-child(1){animation-delay:.05s}
.stage > *:nth-child(2){animation-delay:.13s}
.stage > *:nth-child(3){animation-delay:.3s}
.stage > *:nth-child(4){animation-delay:.4s}
.stage > *:nth-child(5){animation-delay:.52s}
.stage > *:nth-child(6){animation-delay:.64s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

.kicker{
  margin:0;
  font-size:clamp(.58rem, 1.3vh, .7rem);
  font-weight:700; letter-spacing:.46em; text-indent:.46em;
  color:var(--miku-lo); opacity:.85;
}

/* ---------- portrait：超大 ---------- */
.portrait{
  position:relative;
  width:clamp(200px, min(60vh, 72vw), 680px);
  aspect-ratio:1;
  margin:0;
}
.halo{
  position:absolute; inset:-15%; border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0 13%, var(--glow) 25%, transparent 37% 63%, var(--glow) 75%, transparent 87%);
  filter:blur(20px);
  animation:spin 15s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar{
  position:relative; display:block; width:100%; height:100%;
  padding:0; border:0; background:none; border-radius:50%; cursor:pointer;
  animation:breathe 6.5s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.avatar img{
  width:100%; height:100%; border-radius:50%; object-fit:cover;
  box-shadow:0 30px 80px rgba(0,0,0,.62);
}
.ring{
  position:absolute; inset:0; border-radius:50%; pointer-events:none;
  border:3px solid var(--accent);
  box-shadow:
    0 0 0 1px rgba(196,245,239,.34),
    0 0 30px var(--glow),
    0 0 70px var(--glow);
}
.avatar:focus-visible{outline:2px solid var(--miku-hi); outline-offset:9px}

/* ---------- name：悬停浮现，移开模糊 ---------- */
.name{
  display:flex; justify-content:center;
  font-family:var(--sans); font-weight:700;
  font-size:clamp(1.9rem, 7vh, 3.6rem);
  line-height:1.1; letter-spacing:.12em; text-indent:.12em;
  color:var(--miku-hi);
  cursor:pointer; outline:none;
  filter:blur(15px);
  opacity:.4;
  transition:filter .5s ease, opacity .5s ease, text-shadow .5s ease;
}
.name:hover,
.name:focus-visible,
.name.revealed{
  filter:blur(0); opacity:1;
  text-shadow:0 0 10px rgba(57,197,187,.75), 0 0 36px rgba(57,197,187,.6);
  animation:float 3.4s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

.name-hint{
  margin:0;
  font-size:clamp(.6rem, 1.35vh, .72rem);
  letter-spacing:.2em; color:var(--ink-2); opacity:.75;
}

/* ---------- message ---------- */
.msg{margin:0; display:grid; gap:clamp(2px, .6vh, 7px)}
.msg p{
  margin:0;
  font-size:clamp(.8rem, 1.8vh, .98rem);
  line-height:1.95; letter-spacing:.03em;
}
.msg .strong{color:var(--miku-lo); text-shadow:0 0 16px rgba(57,197,187,.5)}

.credit{
  margin:0; padding-top:clamp(7px, 1.4vh, 16px);
  border-top:1px solid var(--line);
  font-size:clamp(.56rem, 1.2vh, .68rem);
  letter-spacing:.13em; color:var(--ink-2); opacity:.8;
}

/* ---------- modal ---------- */
.modal{position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:22px}
.modal[hidden]{display:none}
.modal-mask{
  position:absolute; inset:0; background:rgba(3,14,17,.7);
  backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
  animation:fade .3s ease;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-body{
  position:relative; width:min(100%, 430px); max-height:86svh; overflow:auto;
  padding:2.2rem 1.8rem 1.9rem; border-radius:20px;
  background:var(--card);
  backdrop-filter:blur(20px) saturate(1.3); -webkit-backdrop-filter:blur(20px) saturate(1.3);
  border:1px solid var(--line);
  box-shadow:0 30px 70px rgba(0,0,0,.6), inset 0 0 60px rgba(57,197,187,.14);
  animation:pop .42s cubic-bezier(.2,.9,.3,1.1);
  text-align:left;
}
@keyframes pop{from{opacity:0; transform:translateY(18px) scale(.97)}to{opacity:1; transform:none}}
.modal-close{
  position:absolute; top:.6rem; right:.8rem;
  width:2.2rem; height:2.2rem; border:0; border-radius:50%;
  background:transparent; color:var(--ink-2);
  font-size:1.35rem; line-height:1; cursor:pointer;
}
.modal-close:hover{background:var(--line); color:var(--ink)}
.modal-kicker{margin:0 0 1rem; font-size:.68rem; letter-spacing:.32em; text-indent:.32em; color:var(--miku-lo)}
.modal-body h3{
  margin:0 0 1.5rem; font-family:var(--sans); font-weight:700;
  font-size:2.1rem; letter-spacing:.14em; text-indent:.14em;
  color:var(--miku-hi); text-shadow:0 0 20px rgba(57,197,187,.55);
}
/* ---------- 释义：乆尗 → 救赎 ---------- */
.redeem{
  display:grid; justify-items:center; gap:.5rem;
  margin:0 0 1.2rem; padding:1.1rem 0 1.3rem; text-align:center;
  position:relative;
}
.redeem::before{
  content:""; position:absolute; left:50%; top:50%; width:12rem; height:12rem;
  transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(57,197,187,.22) 0%, transparent 68%);
  animation:redeemHalo 3.6s ease-in-out infinite;
}
@keyframes redeemHalo{0%,100%{opacity:.45; transform:translate(-50%,-50%) scale(.9)}50%{opacity:.9; transform:translate(-50%,-50%) scale(1.06)}}
.redeem-read{
  position:relative; margin:0;
  font-size:.72rem; letter-spacing:.28em; text-indent:.28em; color:var(--ink-2);
}
.redeem-arrow{
  position:relative; width:1px; height:1.9rem; border-radius:2px;
  background:linear-gradient(180deg, transparent, var(--miku), transparent);
  animation:redeemFlow 2.2s ease-in-out infinite;
}
@keyframes redeemFlow{0%,100%{opacity:.3; transform:scaleY(.6)}50%{opacity:1; transform:scaleY(1)}}
.redeem-word{
  position:relative; margin:.1rem 0 0;
  font-family:var(--sans); font-weight:700;
  font-size:clamp(2.6rem, 9vh, 3.4rem); line-height:1.15;
  letter-spacing:.16em; text-indent:.16em;
  background:linear-gradient(100deg,
    var(--miku-hi) 0%, #FFFFFF 16%, var(--miku) 36%,
    var(--miku-pink-lo) 50%, var(--miku) 64%, var(--miku-hi) 100%);
  background-size:260% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  filter:drop-shadow(0 0 14px rgba(57,197,187,.65)) drop-shadow(0 0 38px rgba(225,40,133,.4));
  animation:redeemShimmer 4.6s linear infinite, redeemPop .85s cubic-bezier(.2,.9,.3,1.1) .12s both;
}
@keyframes redeemShimmer{to{background-position:-260% 0}}
@keyframes redeemPop{from{opacity:0; transform:translateY(12px) scale(.9)}to{opacity:1; transform:none}}
.modal-body h3{animation:redeemIn .8s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes redeemIn{from{opacity:0; transform:translateY(-8px); letter-spacing:.42em}to{opacity:1; transform:none}}
.modal-foot b{color:var(--miku-lo); font-weight:700; text-shadow:0 0 16px rgba(57,197,187,.5)}
.modal-foot{
  margin:1.7rem 0 0; padding-top:1.2rem;
  border-top:1px solid var(--line);
  font-size:.82rem; line-height:1.85; color:var(--ink-2);
}
.letter{font-family:var(--kai); font-size:.98rem; line-height:2.1; white-space:pre-wrap; color:var(--ink)}
.letter .sign{display:block; margin-top:1.5rem; text-align:right; color:var(--ink-2); font-size:.88rem}

/* ---------- responsive ---------- */
@media (max-height:660px){
  .portrait{width:clamp(150px, min(52vh, 68vw), 400px)}
  .name{font-size:clamp(1.5rem, 6vh, 2.5rem)}
  .stage{gap:clamp(5px, 1.1vh, 12px)}
  .msg p{line-height:1.8}
}
@media (max-height:470px){
  html,body{overflow:auto}
  .stage{min-height:auto; padding:26px 20px 34px}
}
@media (min-width:820px){
  .msg p{font-size:clamp(.92rem, 1.85vh, 1.06rem)}
}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  .halo,.avatar,.name.revealed,.name:hover,.badge,.stage > *,.eq i,
  .player,.pl-bars i,.pl-nav,.redeem::before,.redeem-arrow,.redeem-word,.modal-body h3{animation:none}
  .stage > *{opacity:1; transform:none}
  .redeem-word{opacity:1; transform:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>
<svg class="tails" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE3DC" stop-opacity="0"/>
      <stop offset=".34" stop-color="#39C5BB" stop-opacity=".62"/>
      <stop offset=".78" stop-color="#39C5BB" stop-opacity=".3"/>
      <stop offset="1" stop-color="#E12885" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M430 -60 C 250 200, 200 520, 300 960" fill="none" stroke="url(#tailGrad)" stroke-width="30" stroke-linecap="round"/>
  <path d="M1010 -60 C 1190 200, 1240 520, 1140 960" fill="none" stroke="url(#tailGrad)" stroke-width="30" stroke-linecap="round"/>
</svg>
<div class="streaks" aria-hidden="true"></div>
<div class="ripple" aria-hidden="true"></div>
<div class="eq" id="eq" aria-hidden="true"></div>
<div class="mark" aria-hidden="true">01</div>
<div class="glowspot" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="badge" id="badge" hidden><span class="dot"></span><span id="badgeText"></span></div>

<!-- 背景音乐歌单：音频在 music/ 目录，歌单在脚本开头的 PLAYLIST 里改 -->
<audio id="bgm" preload="metadata"></audio>
<div class="player" id="playerBox">
  <button class="pl-main" id="playerBtn" type="button" aria-pressed="false" aria-label="播放 / 暂停" title="播放 / 暂停">
    <span class="pl-note" aria-hidden="true">&#9835;</span>
    <span class="pl-meta">
      <span class="pl-title" id="playerTitle">背景音乐</span>
      <span class="pl-sub" id="playerSub">正在载入…</span>
    </span>
    <span class="pl-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
  </button>
  <button class="pl-nav" id="playerPrev" type="button" aria-label="上一首" title="上一首">&#8249;</button>
  <button class="pl-nav" id="playerNext" type="button" aria-label="下一首" title="下一首">&#8250;</button>
</div>

<main class="stage">
  <p class="kicker">SPECIAL THANKS</p>

  <div class="portrait">

  var LUNAR_INFO = [0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2, 0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977, 0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970, 0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950, 0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557, 0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5d0, 0x14573, 0x052d0, 0x0a9a8, 0x0e950, 0x06aa0, 0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0, 0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b5a0, 0x195a6, 0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570, 0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0, 0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5, 0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930, 0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530, 0x05aa0, 0x076a3, 0x096d0, 0x04bd7, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45, 0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0, 0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0, 0x0a2e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4, 0x052d0, 0x0a9b8, 0x0a950, 0x0a4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba0, 0x0a5b0, 0x052b0, 0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d260, 0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a4d0, 0x0d150, 0x0f252, 0x0d520];

  var LUNAR_MONTH = {
    1: '正月', 2: '二月', 3: '三月', 4: '四月', 5: '五月', 6: '六月',
    7: '七月', 8: '八月', 9: '九月', 10: '十月', 11: '冬月', 12: '腊月'
  };

  var LUNAR_BASE = Math.floor(Date.UTC(1900, 0, 31) / 86400000);

  function lLeapMonth(y) { return LUNAR_INFO[y - 1900] & 0xf; }
  function lLeapDays(y) { return lLeapMonth(y) ? ((LUNAR_INFO[y - 1900] & 0x10000) ? 30 : 29) : 0; }
  function lMonthDays(y, m) { return (LUNAR_INFO[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function lYearDays(y) {
    var i, s = 348;
    for (i = 0x8000; i > 0x8; i >>= 1) s += (LUNAR_INFO[y - 1900] & i) ? 1 : 0;
    return s + lLeapDays(y);
  }

  /* 以访客本地日历日期换算农历，与浏览器时区无关 */
  function lunarOf(date) {
    var y = date.getFullYear(), mo = date.getMonth() + 1, dy = date.getDate();
    if (y < 1901 || y > 2099) return null;
    var offset = Math.floor(Date.UTC(y, mo - 1, dy) / 86400000) - LUNAR_BASE;
    var i, leap = 0, temp = 0;
    for (i = 1900; i < 2100 && offset > 0; i++) { temp = lYearDays(i); offset -= temp; }
    if (offset < 0) { offset += temp; i--; }
    var ly = i;
    leap = lLeapMonth(ly);
    var isLeap = false;
    for (i = 1; i < 13 && offset > 0; i++) {
      if (leap > 0 && i === (leap + 1) && isLeap === false) { --i; isLeap = true; temp = lLeapDays(ly); }
      else { temp = lMonthDays(ly, i); }
      if (isLeap === true && i === (leap + 1)) isLeap = false;
      offset -= temp;
    }
    if (offset === 0 && leap > 0 && i === leap + 1) {
      if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
    }
    if (offset < 0) { offset += temp; --i; }
    return { n: i, m: LUNAR_MONTH[i] || (i + '\u6708'), d: offset + 1, leap: isLeap };
  }

  function lunarDay(d) {
    var n = ['', '初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
             '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
             '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];
    return n[d] || d;
  }

  var SOLAR = {
    '1-1':   { key: 'newyear',    name: '元旦',   accent: '#39C5BB' },
    '2-14':  { key: 'valentine',  name: '情人节', accent: '#E0708C' },
    '4-1':   { key: 'aprilfool',  name: '愚人节', accent: '#7FE3DC' },
    '5-1':   { key: 'labour',     name: '劳动节', accent: '#39C5BB' },
    '5-20':  { key: 'love520',    name: '520',    accent: '#E0708C' },
    '6-1':   { key: 'children',   name: '儿童节', accent: '#5BAFD6' },
    '10-1':  { key: 'national',   name: '国庆',   accent: '#E0708C' },
    '12-24': { key: 'christmas',  name: '平安夜', accent: '#7FE3DC' },
    '12-25': { key: 'christmas',  name: '圣诞',   accent: '#7FE3DC' },
    '12-31': { key: 'newyear',    name: '跨年',   accent: '#39C5BB' }
  };

  var LUNAR = {
    '正月-1':  { key: 'spring',    name: '春节',   accent: '#E0708C' },
    '正月-15': { key: 'lantern',   name: '元宵',   accent: '#E8A0B8' },
    '五月-5':  { key: 'dragon',    name: '端午',   accent: '#6E9A72' },
    '七月-7':  { key: 'qixi',      name: '七夕',   accent: '#D77BA0' },
    '八月-15': { key: 'midautumn', name: '中秋',   accent: '#E8C97E' },
    '九月-9':  { key: 'chongyang', name: '重阳',   accent: '#C98A4B' }
  };

  var ANNIV = { key: 'anniversary', name: '纪念日', accent: '#7FE3DC' };

  var holiday = null;
  if (SOLAR[M + '-' + D]) holiday = SOLAR[M + '-' + D];

  var lm = lunarOf(now);
  if (lm && !lm.leap) {
    if (LUNAR[lm.m + '-' + lm.d]) holiday = LUNAR[lm.m + '-' + lm.d];
    var lt = lunarOf(new Date(now.getTime() + 86400000));
    if (lt && !lt.leap && lt.m === '正月' && lt.d === 1) {
      holiday = { key: 'newyear_eve', name: '除夕', accent: '#E0708C' };
    }
  }
  if (M === 9 && D === 29) holiday = ANNIV;

  function season() {
    if (M >= 3 && M <= 5) return 'spring';
    if (M >= 6 && M <= 8) return 'summer';
    if (M >= 9 && M <= 11) return 'autumn';
    return 'winter';
  }

  /* ============ 2. 节日主题 ============ */
  function hexA(hex, a) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }

  if (holiday) {
    root.style.setProperty('--accent', holiday.accent);
    root.style.setProperty('--glow', hexA(holiday.accent, 0.5));
    var lunarText = lm ? lm.m + lunarDay(lm.d) : '';
    document.getElementById('badgeText').textContent =
      holiday.key === 'anniversary' ? lunarText
        : (holiday.name + (lunarText ? ' · ' + lunarText : ''));
    document.getElementById('badge').hidden = false;
  }

  document.getElementById('dateText').textContent =
    Y + '.' + String(M).padStart(2, '0') + '.' + String(D).padStart(2, '0');

  /* ============ 3. 频谱条（Miku 视觉） ============ */
  var eq = document.getElementById('eq');
  if (eq) for (var i = 0; i < 30; i++) eq.appendChild(document.createElement('i'));

  /* ============ 4. 粒子：青色音符 + 星屑 ============ */
  var PALETTE = {
    spring: ['#8FE9DC', '#B8F2E8', '#FFB3D9'],
    summer: ['#39C5BB', '#7FE3DC', '#FF9CCB'],
    autumn: ['#39C5BB', '#6FD9C4', '#F58FC0'],
    winter: ['#A9E8F2', '#CDF2F7', '#FFC7E2']
  };
  var NOTES = ['\u266A', '\u266B', '\u2669', '\u266C'];
  var colors = PALETTE[season()];
  var glowColor = (holiday && holiday.key === 'anniversary') ? '#C4F5EF' : '#39C5BB';

  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, Hh = 0, parts = [], raf = null;

  function makeParticle(seed) {
    var isNote = Math.random() < 0.42;
    return {
      note: isNote,
      g: NOTES[(Math.random() * NOTES.length) | 0],
      x: Math.random() * W,
      y: seed ? Math.random() * Hh : Hh + 30,
      r: isNote ? 9 + Math.random() * 14 : 1.1 + Math.random() * 2.1,
      vy: -(0.14 + Math.random() * 0.44),
      vx: (Math.random() - 0.5) * 0.26,
      rot: (Math.random() - 0.5) * 0.5,
      vr: (Math.random() - 0.5) * 0.008,
      a: isNote ? 0.2 + Math.random() * 0.34 : 0.3 + Math.random() * 0.5,
      ph: Math.random() * Math.PI * 2,
      c: isNote ? glowColor : colors[(Math.random() * colors.length) | 0]
    };
  }

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; Hh = window.innerHeight;
    cv.width = Math.floor(W * dpr); cv.height = Math.floor(Hh * dpr);
    cv.style.width = W + 'px'; cv.style.height = Hh + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var want = Math.round(46 * Math.min(1, W / 900 + 0.4));
    parts = [];
    for (var i = 0; i < want; i++) parts.push(makeParticle(true));
  }

  function drawParticle(p) {
    ctx.save();
    ctx.globalAlpha = p.a;
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = p.c;
    if (p.note) {
      ctx.font = p.r + 'px "Segoe UI Symbol","Noto Sans Symbols",sans-serif';
      ctx.shadowBlur = 14; ctx.shadowColor = glowColor;
      ctx.fillText(p.g, -p.r * 0.5, p.r * 0.35);
    } else {
      ctx.shadowBlur = 10; ctx.shadowColor = p.c;
      ctx.beginPath();
      ctx.moveTo(0, -p.r * 1.9); ctx.quadraticCurveTo(0, 0, p.r * 1.9, 0);
      ctx.quadraticCurveTo(0, 0, 0, p.r * 1.9); ctx.quadraticCurveTo(0, 0, -p.r * 1.9, 0);
      ctx.quadraticCurveTo(0, 0, 0, -p.r * 1.9);
      ctx.fill();
    }
    ctx.restore();
  }

  function step(t) {
    ctx.clearRect(0, 0, W, Hh);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.y += p.vy;
      p.x += p.vx + Math.sin(t * 0.0011 + p.ph) * 0.3;
      p.rot += p.vr;
      if (p.y < -50) { p.y = Hh + 34; p.x = Math.random() * W; }
      if (p.x < -50) p.x = W + 30;
      else if (p.x > W + 50) p.x = -30;
      drawParticle(p);
    }
    raf = requestAnimationFrame(step);
  }

  if (!reduceMotion) {
    resize();
    window.addEventListener('resize', resize, { passive: true });
    raf = requestAnimationFrame(step);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      else if (!raf) { raf = requestAnimationFrame(step); }
    });
  }

  /* ============ 5. 名字：悬停浮现 / 触屏点击浮现 ============ */
  var nameEl = document.getElementById('nameEl');
  var revealTimer = null;

  function reveal() {
    nameEl.classList.add('revealed');
    clearTimeout(revealTimer);
    revealTimer = setTimeout(function () { nameEl.classList.remove('revealed'); }, 2600);
  }

  nameEl.addEventListener('click', function () { reveal(); bumpName(); });
  nameEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); reveal(); bumpName(); }
  });

  /* ============ 6. 彩蛋 ============ */
  var cardModal = document.getElementById('cardModal');
  var letterModal = document.getElementById('letterModal');
  var lastFocus = null;

  document.getElementById('letterBody').textContent =
    '致 乆尗：\n\n' +
    '我在用 LetsGal Studio 做一款游戏，\n' +
    '做了很久，也想过很多次要不要放弃。\n\n' +
    '它开始收费的那天，我以为故事就停在这里了。\n' +
    '然后你把全款付了，一句话也没多说。\n\n' +
    '所以这一页没有别的意思——\n' +
    '只是想让每一个打开它的人，\n' +
    '都先看清你的名字。\n\n' +
    '谢谢你。';

  function openModal(m) {
    lastFocus = document.activeElement;
    m.hidden = false;
    var btn = m.querySelector('.modal-close');
    if (btn) btn.focus();
  }
  function closeModal(m) {
    m.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById('avatarBtn').addEventListener('click', function () { openModal(cardModal); });

  var clicks = 0, clickTimer = null;
  function bumpName() {
    clicks++;
    if (clicks >= 5) { clicks = 0; openModal(letterModal); return; }
    clearTimeout(clickTimer);
    clickTimer = setTimeout(function () { clicks = 0; }, 1800);
  }

  document.querySelectorAll('.modal').forEach(function (m) {
    m.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-close')) closeModal(m);
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!cardModal.hidden) closeModal(cardModal);
    if (!letterModal.hidden) closeModal(letterModal);
  });

  /* ============ 7. 背景音乐歌单（固定曲目） ============ */
  var PLAYLIST = [
    { src: 'music/01-deep-sea-girl.m4a',    title: '深海少女',               artist: 'ゆうゆ feat. 初音ミク' },
    { src: 'music/02-kumoito-monopoly.m4a', title: '蜘蛛糸モノポリー',         artist: 'sasakure.UK feat. 初音ミク' },
    { src: 'music/03-bakemono-no-uta.mp3',  title: 'バケモノの唄 · 怪物之歌',  artist: 'shino feat. 初音ミク' },
    { src: 'music/04-moon.m4a',             title: 'moon',                   artist: 'iroha(sasaki) feat. 初音ミク' },
    { src: 'music/05-love-list.m4a',        title: 'ラブリスト更新中？',       artist: '畑亜貴 feat. 初音ミク' },
    { src: 'music/06-kamikyoku.mp3',        title: '神曲',                   artist: 'おにゅうP feat. 初音ミク' }
  ];
  var BGM_VOLUME = 0.6;             /* 音量 0 ~ 1 */
  var AUTOPLAY_ON_FIRST_TAP = true; /* 混合策略：进站先尝试自动播放，被拦截则降级为首次点击/按键播放 */

  var bgm = document.getElementById('bgm');
  var playerBox = document.getElementById('playerBox');
  var playerBtn = document.getElementById('playerBtn');
  var playerTitle = document.getElementById('playerTitle');
  var playerSub = document.getElementById('playerSub');
  var trackIdx = 0;

  bgm.volume = BGM_VOLUME;
  bgm.loop = false;   /* 单曲不循环，播完自动接下一首 */

  function renderTrack() {
    var t = PLAYLIST[trackIdx];
    playerTitle.textContent = t.title;
    playerSub.textContent = t.artist + ' · ' + (trackIdx + 1) + '/' + PLAYLIST.length;
  }

  function setPlaying(on) {
    playerBox.classList.toggle('playing', !!on);
    playerBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function playBgm() {
    var p = bgm.play();
    if (p && p.catch) p.catch(function () { setPlaying(false); });
  }

  function loadTrack(i, autoplay) {
    trackIdx = ((i % PLAYLIST.length) + PLAYLIST.length) % PLAYLIST.length;
    bgm.src = PLAYLIST[trackIdx].src;
    renderTrack();
    if (autoplay) playBgm();
  }

  playerBtn.addEventListener('click', function () { if (bgm.paused) playBgm(); else bgm.pause(); });
  document.getElementById('playerPrev').addEventListener('click', function () { loadTrack(trackIdx - 1, true); });
  document.getElementById('playerNext').addEventListener('click', function () { loadTrack(trackIdx + 1, true); });
  bgm.addEventListener('play', function () {
    setPlaying(true);
    renderTrack();   /* 播放成功时恢复“歌名 · 演唱者”，覆盖“点击开启音乐”提示 */
  });
  bgm.addEventListener('pause', function () { setPlaying(false); });
  bgm.addEventListener('ended', function () { loadTrack(trackIdx + 1, true); });
  bgm.addEventListener('error', function () {
    playerSub.textContent = '这首加载失败 · 点 › 换一首';
    console.warn('[BGM] 音频加载失败：' + PLAYLIST[trackIdx].src);
  });

  loadTrack(0, false);

  if (AUTOPLAY_ON_FIRST_TAP) {
    var onFirstInteract = function (e) {
      var inside = e && e.target && playerBox.contains(e.target);
      disarmTap();
      if (inside) return;          /* 用户自己在点播放器，交给按钮自身逻辑 */
      if (bgm.paused) playBgm();
    };
    var armTap = function () {
      document.addEventListener('pointerdown', onFirstInteract);
      document.addEventListener('keydown', onFirstInteract);
    };
    var disarmTap = function () {
      document.removeEventListener('pointerdown', onFirstInteract);
      document.removeEventListener('keydown', onFirstInteract);
    };

    /* ① 进站先直接尝试自动播放（已授权站点 / 回访用户可成功） */
    var attempt = bgm.play();
    if (attempt && attempt.catch) {
      attempt.catch(function () {
        /* ② 被浏览器拦截：显示提示，等待首次点击/按键再播 */
        setPlaying(false);
        playerSub.textContent = '点击开启音乐';
        armTap();
      });
    } else {
      setPlaying(true);
    }
  }
})();
</script>
